<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codaix — Data Pipelines</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #0b0e14;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
    }

    /* ─── Écran de chargement ─── */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Nav ─── */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem 6vw 0;
    }

    .nav-logo {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.4rem;
    }

    .nav-toggle span {
      width: 22px;
      height: 2px;
      background: #ffffff;
      display: block;
    }

    @media (max-width: 720px) {
      .nav-links {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        width: min(260px, 70vw);
        background: rgba(6, 9, 16, 0.97);
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 1.75rem;
        padding: 2rem 2rem;
        transform: translateX(100%);
        transition: transform 0.25s ease;
      }

      .nav-links.open {
        transform: translateX(0);
      }

      .nav-toggle {
        display: flex;
      }
    }

    /* ─── Hero ─── */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 560px;
      width: 100%;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/images/landing/hero.jpg');
      background-size: cover;
      background-position: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(6, 9, 16, 0.88) 0%,
        rgba(6, 9, 16, 0.72) 32%,
        rgba(6, 9, 16, 0.35) 60%,
        rgba(6, 9, 16, 0.08) 100%
      );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 6vw;
    }

    .hero-text {
      max-width: 620px;
    }

    .hero-title {
      margin: 0 0 0.5rem;
      color: #ffffff;
      font-size: clamp(1.9rem, 4vw, 3.1rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .hero-role {
      margin: 0 0 1.5rem;
      color: #93c5fd;
      font-size: clamp(1.4rem, 2.6vw, 1.9rem);
      font-weight: 600;
      line-height: 1.3;
    }

    .hero-tagline {
      margin: 0 0 2.25rem;
      color: rgba(255, 255, 255, 0.82);
      font-size: clamp(1rem, 1.3vw, 1.15rem);
      line-height: 1.6;
      font-weight: 400;
      max-width: 520px;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      padding: 0.95rem 2rem;
      border-radius: 8px;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .hero-cta:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    @media (max-width: 640px) {
      .hero-content {
        padding: 0 6vw;
      }
      .hero-title {
        font-size: 1.6rem;
      }
      .hero-overlay {
        background: linear-gradient(
          180deg,
          rgba(6, 9, 16, 0.55) 0%,
          rgba(6, 9, 16, 0.85) 55%,
          rgba(6, 9, 16, 0.92) 100%
        );
      }
      .hero-content {
        align-items: flex-end;
        padding-bottom: 3rem;
      }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <header class="nav-bar">
    <a class="nav-logo" href="index.html">Codaix</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links" id="nav-links">
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#skills">Skills</a>
      <a href="index.html#education">Education</a>
      <a href="index.html#experience">Experience</a>
      <a href="https://form.typeform.com/to/WQPiXRuC" target="_blank" rel="noopener noreferrer">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-text">
        <h1 class="hero-title">Codaix</h1>
        <p class="hero-role">Data engineering & solution IA</p>
        <p class="hero-tagline">
          Architecture Cloud, ingénierie de la donnée et solutions IA sur mesure pour répondre à vos véritables enjeux métiers.
        </p>
        <a class="hero-cta" href="index.html">
          En savoir plus
        </a>
      </div>
    </div>
  </section>

  <script>
    window.addEventListener('load', () => {
      document.getElementById('loader').classList.add('hidden');
    });

    document.getElementById('nav-toggle').addEventListener('click', () => {
      document.getElementById('nav-links').classList.toggle('open');
    });
  </script>
</body>
</html>
