<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julien Charlier — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="#" class="logo" id="nav-name">Julien Charlier</a>
      <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
      <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Changer de langue">FR</button>
    </div>
  </header>

  <main>
    <section class="hero section" id="hero"></section>
    <section class="section" id="about"></section>
    <section class="section section-alt" id="education"></section>
    <section class="section" id="experience"></section>
    <section class="section section-alt" id="skills"></section>
    <section class="section" id="projects"></section>
    <section class="section" id="contact"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <div class="error-banner hidden" id="error-banner" role="alert"></div>

  <script src="app.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  <style>
    /* ─── Thème du chat calé sur la charte du portfolio (styles.css) ─── */
    :root {
      /* Couleurs de base */
      --chat--color--primary: #2563eb;
      --chat--color--primary-shade-50: #1d4ed8;
      --chat--color--primary--shade-100: #1e40af;
      --chat--color--secondary: #2563eb;
      --chat--color-secondary-shade-50: #1d4ed8;
      --chat--color-white: #ffffff;
      --chat--color-light: #5c5c5c;
      --chat--color-light-shade-50: #f0f2f5;
      --chat--color-light-shade-100: #e2e5ea;
      --chat--color-medium: #e2e5ea;
      --chat--color-dark: #1a1a1a;
      --chat--color-disabled: #a3a3a3;
      --chat--color-typing: #5c5c5c;

      /* Layout de base */
      --chat--spacing: 1rem;
      --chat--border-radius: 10px;
      --chat--transition-duration: 0.15s;
      --chat--font-family: 'Inter', system-ui, -apple-system, sans-serif;

      /* Fenêtre */
      --chat--window--width: 380px;
      --chat--window--height: 600px;
      --chat--window--bottom: var(--chat--spacing);
      --chat--window--right: var(--chat--spacing);
      --chat--window--z-index: 9999;
      --chat--window--border: 1px solid #e2e5ea;
      --chat--window--border-radius: 16px;
      --chat--window--margin-bottom: var(--chat--spacing);

      /* Header */
      --chat--header-height: auto;
      --chat--header--padding: 1.25rem;
      --chat--header--background: #ffffff;
      --chat--header--color: #1a1a1a;
      --chat--header--border-top: none;
      --chat--header--border-bottom: 1px solid #e2e5ea;
      --chat--header--border-left: none;
      --chat--header--border-right: none;
      --chat--heading--font-size: 1.3em;
      --chat--subtitle--font-size: 0.85em;
      --chat--subtitle--line-height: 1.6;

      /* Messages */
      --chat--message--font-size: 0.95rem;
      --chat--message--padding: 0.85rem 1rem;
      --chat--message--border-radius: 10px;
      --chat--message-line-height: 1.5;
      --chat--message--margin-bottom: 0.75rem;
      --chat--message--bot--background: #f0f2f5;
      --chat--message--bot--color: #1a1a1a;
      --chat--message--bot--border: 1px solid #e2e5ea;
      --chat--message--user--background: #2563eb;
      --chat--message--user--color: #ffffff;
      --chat--message--user--border: none;
      --chat--message--pre--background: rgba(0, 0, 0, 0.04);
      --chat--messages-list--padding: 1rem;

      /* Bouton flottant (toggle) */
      --chat--toggle--size: 56px;
      --chat--toggle--width: var(--chat--toggle--size);
      --chat--toggle--height: var(--chat--toggle--size);
      --chat--toggle--border-radius: 50%;
      --chat--toggle--background: #2563eb;
      --chat--toggle--hover--background: #1d4ed8;
      --chat--toggle--active--background: #1e40af;
      --chat--toggle--color: #ffffff;

      /* Zone de saisie */
      --chat--textarea--height: 50px;
      --chat--textarea--max-height: 30rem;
      --chat--input--font-size: 0.9rem;
      --chat--input--border: 1px solid #e2e5ea;
      --chat--input--border-radius: 8px;
      --chat--input--padding: 0.7rem 1rem;
      --chat--input--background: #ffffff;
      --chat--input--text-color: #1a1a1a;
      --chat--input--line-height: 1.5;
      --chat--input--placeholder--font-size: inherit;
      --chat--input--border-active: 1px solid #2563eb;
      --chat--input--left--panel--width: 2rem;
      --chat--input--container--background: #ffffff;
      --chat--input--container--border: 1px solid #e2e5ea;
      --chat--input--container--border-radius: 12px;
      --chat--input--container--padding: 10px;

      /* Boutons */
      --chat--button--padding: 0.6rem 1rem;
      --chat--button--border-radius: 8px;
      --chat--button--font-size: 0.9rem;
      --chat--button--line-height: 1;
      --chat--button--color--primary: #ffffff;
      --chat--button--background--primary: #2563eb;
      --chat--button--border--primary: none;
      --chat--button--color--primary--hover: #ffffff;
      --chat--button--background--primary--hover: #1d4ed8;
      --chat--button--border--primary--hover: none;
      --chat--button--color--primary--disabled: #a3a3a3;
      --chat--button--background--primary--disabled: #f0f2f5;
      --chat--button--border--primary--disabled: none;
      --chat--button--color--secondary: #1a1a1a;
      --chat--button--background--secondary: #f0f2f5;
      --chat--button--border--secondary: 1px solid #e2e5ea;
      --chat--button--color--secondary--hover: #2563eb;
      --chat--button--background--secondary--hover: #e2e5ea;
      --chat--button--border--secondary--hover: 1px solid #2563eb;
      --chat--button--color--secondary--disabled: #a3a3a3;
      --chat--button--background--secondary--disabled: #f0f2f5;
      --chat--button--border--secondary--disabled: none;
      --chat--close--button--color-hover: #2563eb;

      /* Boutons envoi / fichier */
      --chat--input--send--button--background: transparent;
      --chat--input--send--button--color: #2563eb;
      --chat--input--send--button--background-hover: transparent;
      --chat--input--send--button--color-hover: #1d4ed8;
      --chat--input--file--button--background: transparent;
      --chat--input--file--button--color: #5c5c5c;
      --chat--input--file--button--background-hover: transparent;
      --chat--input--file--button--color-hover: #1a1a1a;
      --chat--files-spacing: 0.25rem;

      /* Corps et pied */
      --chat--body--background: #ffffff;
      --chat--footer--background: #ffffff;
      --chat--footer--color: #5c5c5c;
    }

    .chat-message {
      max-width: 85%;
    }

    /* Options rapides affichées à l'ouverture du chat */
    .nm-quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.25rem 0 1rem;
    }

    .nm-quick-reply-btn {
      padding: 0.45rem 0.95rem;
      border-radius: 20px;
      border: 1px solid #2563eb;
      background: #ffffff;
      color: #2563eb;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .nm-quick-reply-btn:hover {
      background: #2563eb;
      color: #ffffff;
    }
  </style>
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';
    createChat({
      webhookUrl: 'https://n8n-cwqb.srv1518554.hstgr.cloud/webhook/9fa71e51-f33c-48ce-8743-fd98b3be4550/chat',
      defaultLanguage: 'fr',
      initialMessages: [
        'Bonjour ! 👋',
        "Je suis l'assistant personnel de Julien. Comment puis-je vous aider aujourd'hui ?"
      ],
      i18n: {
        fr: {
          title: 'Bonjour ! 👋',
          subtitle: "Je suis l'assistant personnel de Julien. Posez-moi vos questions sur son parcours, ses compétences ou ses projets.",
          footer: '',
          getStarted: 'Nouvelle conversation',
          inputPlaceholder: 'Écrivez votre message...',
          closeButtonTooltip: 'Fermer le chat'
        }
      }
    });

    // ─── Options rapides cliquables à l'ouverture du chat ───
    const quickReplies = [
      { label: '📅 Prendre un rendez-vous', message: 'Je souhaite prendre un rendez-vous avec Julien.' },
      { label: '💬 Poser une question', message: null },
      { label: '💼 Dernier projet', message: 'Présente-moi le dernier projet, le dashboard de disponibilité des parkings à Aix-en-Provence, avec le lien de démo.' }
    ];

    function nmRemoveQuickReplies() {
      document.querySelectorAll('.nm-quick-replies').forEach((el) => el.remove());
    }

    function nmSendQuickReply(text) {
      const textarea = document.querySelector('.chat-input textarea');
      if (!textarea) return;
      const setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
      setter.call(textarea, text);
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
      requestAnimationFrame(() => {
        const sendBtn = document.querySelector('.chat-input-send-button');
        if (sendBtn && !sendBtn.disabled) sendBtn.click();
      });
    }

    function nmAlreadyChatted() {
      return document.querySelectorAll('.chat-message-from-user').length > 0;
    }

    function nmLockInput() {
      const textarea = document.querySelector('.chat-input textarea');
      if (!textarea || textarea.disabled) return;
      textarea.disabled = true;
      textarea.dataset.nmOriginalPlaceholder = textarea.placeholder;
      textarea.placeholder = 'Choisissez une option ci-dessus pour commencer…';
    }

    function nmUnlockInput() {
      const textarea = document.querySelector('.chat-input textarea');
      if (!textarea) return;
      textarea.disabled = false;
      if (textarea.dataset.nmOriginalPlaceholder) {
        textarea.placeholder = textarea.dataset.nmOriginalPlaceholder;
      }
      textarea.focus();
    }

    function nmInjectQuickReplies(list) {
      if (list.dataset.nmInjected) return;
      list.dataset.nmInjected = '1';
      if (nmAlreadyChatted()) return;
      const wrap = document.createElement('div');
      wrap.className = 'nm-quick-replies';
      quickReplies.forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nm-quick-reply-btn';
        btn.textContent = opt.label;
        btn.addEventListener('click', () => {
          nmRemoveQuickReplies();
          nmUnlockInput();
          if (opt.message) nmSendQuickReply(opt.message);
        });
        wrap.appendChild(btn);
      });
      list.appendChild(wrap);
    }

    const nmObserver = new MutationObserver(() => {
      const list = document.querySelector('.chat-messages-list');
      if (list) nmInjectQuickReplies(list);

      const sendBtn = document.querySelector('.chat-input-send-button');
      if (sendBtn && !sendBtn.dataset.nmBound) {
        sendBtn.dataset.nmBound = '1';
        sendBtn.addEventListener('click', nmRemoveQuickReplies);
      }
      const textarea = document.querySelector('.chat-input textarea');
      if (textarea && !textarea.dataset.nmBound) {
        textarea.dataset.nmBound = '1';
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) nmRemoveQuickReplies();
        });
        if (!nmAlreadyChatted()) nmLockInput();
      }
    });
    nmObserver.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
